<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --ink: #0B0F13;
    --panel: #151C24;
    --line: #24313D;
    --trace: #2B3947;
    --live: #35D07F;
    --open: #F2B441;
    --fault: #E5484D;
    --text: #E7EEF5;
    --muted: #7E92A6;
    --body: #B7C6D4;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 380px; max-height: 580px; overflow-y: auto;
    background: var(--ink); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.5;
    padding: 18px 18px 14px;
  }
  .eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: .16em;
             text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 19px; font-weight: 600; letter-spacing: -.01em; margin: 4px 0 3px; }
  .project { color: var(--muted); font-size: 12.5px; line-height: 1.45; }

  .ask { margin: 16px 0 4px; display: flex; gap: 8px; }
  .ask input {
    flex: 1; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px;
    padding: 10px 12px; font: inherit; font-size: 13.5px;
  }
  .ask input::placeholder { color: #5D6E7F; }
  .ask input:focus { outline: 2px solid var(--open); outline-offset: 1px; border-color: transparent; }
  .ask button {
    background: var(--open); color: #14181C; border: none; border-radius: 9px;
    padding: 10px 15px; font: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer;
  }
  .ask button:hover { background: #FFC85C; }
  .ask button:disabled { background: #3A4B5C; color: var(--muted); cursor: default; }

  .show-btn {
    width: 100%; margin-top: 8px; background: transparent; color: var(--body);
    border: 1px dashed var(--line); border-radius: 9px; padding: 9px 12px;
    font: inherit; font-size: 13px; cursor: pointer;
  }
  .show-btn:hover { background: var(--panel); border-color: #35506B; color: var(--text); }

  .note {
    margin-top: 12px; padding: 11px 13px; border-radius: 9px;
    background: rgba(242,180,65,.09); border: 1px solid rgba(242,180,65,.22);
    font-size: 13px; color: #F4D79A; line-height: 1.5;
  }
  .note.bad { background: rgba(229,72,77,.09); border-color: rgba(229,72,77,.25); color: #F2A5A7; }

  h2 { font-family: var(--mono); font-size: 10px; letter-spacing: .16em;
       text-transform: uppercase; color: var(--muted); font-weight: 400;
       margin: 22px 0 10px; }

  /* items hang off a single trace running down the left */
  .rail { position: relative; padding-left: 20px; }
  .rail::before {
    content: ""; position: absolute; left: 4px; top: 8px; bottom: 8px;
    width: 1.5px; background: var(--trace); border-radius: 1px;
  }
  .item {
    position: relative; display: block; width: 100%; text-align: left;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 13px; margin-bottom: 8px; cursor: pointer;
    font: inherit; color: var(--text);
    transition: border-color .12s, background .12s;
  }
  .item::before {
    content: ""; position: absolute; left: -20.5px; top: 17px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--trace); border: 2px solid var(--ink);
    transition: background .12s;
  }
  .item::after {
    content: ""; position: absolute; left: -12px; top: 21px;
    width: 12px; height: 1.5px; background: var(--trace);
  }
  .item:hover { border-color: #35506B; background: #19222C; }
  .item:hover::before { background: var(--live); }
  .item:focus-visible { outline: 2px solid var(--open); outline-offset: 2px; }
  .item .label { font-size: 14px; font-weight: 500; line-height: 1.35; }
  .item .why { font-size: 12.5px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
  .item .host { font-family: var(--mono); font-size: 10.5px; color: #5D6E7F; margin-top: 5px; }

  .skeleton { height: 52px; border-radius: 10px; background: var(--panel);
              border: 1px solid var(--line); margin-bottom: 8px; animation: blink 1.1s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: .35 } 50% { opacity: .8 } }

  footer { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line);
           display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .link { background: none; border: none; padding: 0; cursor: pointer;
          font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em;
          text-transform: uppercase; color: var(--muted); }
  .link:hover { color: var(--body); }
  .link:focus-visible { outline: 2px solid var(--open); outline-offset: 3px; }

  .empty { color: var(--muted); font-size: 13px; }
  .pass { display: inline-block; font-family: var(--mono); font-size: 10px;
          letter-spacing: .1em; text-transform: uppercase; color: var(--live);
          border: 1px solid rgba(53,208,127,.3); border-radius: 999px;
          padding: 3px 9px; margin: 10px 6px 0 0; }

  /* side quest */
  #quest { margin-top: 14px; }
  .quest {
    border: 1px solid var(--line); border-radius: 12px; padding: 15px 16px;
    background: var(--panel);
  }
  .quest.big {
    border-color: rgba(242,180,65,.4);
    background: linear-gradient(180deg, rgba(242,180,65,.1), var(--panel));
    animation: rise .3s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  .quest .kicker { font-family: var(--mono); font-size: 10px; letter-spacing: .16em;
                   text-transform: uppercase; color: var(--open); }
  .quest .head { font-size: 15px; font-weight: 600; margin-top: 5px; }
  .quest .body { font-size: 13px; color: var(--body); margin-top: 5px; line-height: 1.5; }
  .quest .q { font-size: 14.5px; font-weight: 500; margin-top: 10px; line-height: 1.4; }
  .quest .src { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 6px; }
  .quest .tries { display: flex; gap: 5px; margin-top: 12px; }
  .quest .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--open); }
  .quest .dot.used { background: var(--trace); }
  .quest textarea {
    width: 100%; margin-top: 10px; min-height: 56px; resize: none;
    background: #0F151B; color: var(--text); border: 1px solid var(--line);
    border-radius: 9px; padding: 10px 12px; font: inherit; font-size: 13.5px; line-height: 1.45;
  }
  .quest textarea:focus { outline: 2px solid var(--open); outline-offset: 1px; border-color: transparent; }
  .quest .row { display: flex; gap: 8px; margin-top: 10px; }
  .quest button {
    font: inherit; font-size: 13.5px; font-weight: 500; border-radius: 9px;
    padding: 9px 16px; cursor: pointer; border: 1px solid transparent;
  }
  .quest .primary { background: var(--open); color: #14181C; }
  .quest .primary:hover { background: #FFC85C; }
  .quest .primary:disabled { background: var(--trace); color: var(--muted); cursor: default; }
  .quest .ghost { background: transparent; color: var(--body); border-color: var(--line); }
  .quest .ghost:hover { background: #1B242D; }
  .quest .hint { font-size: 12.5px; margin-top: 10px; line-height: 1.45; }
  .quest .hint.wrong { color: #F2A5A7; }
  .quest .hint.right { color: var(--live); }
  .quest .meter { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em;
                  text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  [hidden] { display: none !important; }

  /* session */
  #session { margin-top: 14px; }
  .sess-card { border: 1px solid rgba(53,208,127,.35); border-radius: 12px; padding: 15px 16px;
               background: linear-gradient(180deg, rgba(53,208,127,.1), var(--panel)); }
  .sess-card .kicker { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--live); }
  .sess-card .head { font-size: 16px; font-weight: 600; margin-top: 5px; }
  .sess-card .body { font-size: 13px; color: var(--body); margin-top: 5px; line-height: 1.5; }
  .sess-card textarea { width: 100%; margin-top: 11px; min-height: 54px; resize: none; background: #0F151B;
    color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; font: inherit; font-size: 14px; line-height: 1.45; }
  .sess-card input { width: 100%; margin-top: 8px; background: #0F151B; color: var(--text); border: 1px solid var(--line);
    border-radius: 9px; padding: 10px 12px; font: inherit; font-size: 14px; }
  .sess-card textarea:focus, .sess-card input:focus { outline: 2px solid var(--live); outline-offset: 1px; border-color: transparent; }
  .sess-card .err { color: var(--fault); font-size: 12.5px; min-height: 16px; margin-top: 6px; }
  .sess-card button { width: 100%; margin-top: 4px; background: var(--live); color: #08140C; border: none;
    border-radius: 9px; padding: 11px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .sess-card button:hover { background: #56E39B; }
  .sess-card .muted { font-size: 12.5px; color: var(--muted); margin-top: 10px; line-height: 1.45; }

  .sess-chip { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 13px; background: var(--panel); }
  .sess-chip .g { font-size: 13px; color: var(--body); overflow: hidden; }
  .sess-chip .g b { color: var(--text); font-weight: 600; }
  .sess-chip .g .lab { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--live); display: block; margin-bottom: 2px; }
  .sess-chip button { background: none; border: none; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .sess-chip button:hover { color: var(--body); }

  /* dad mode */
  .dad-banner {
    margin-top: 14px; padding: 12px 14px; border-radius: 11px;
    background: linear-gradient(180deg, rgba(90,169,255,.12), var(--panel));
    border: 1px solid rgba(90,169,255,.35);
  }
  .dad-row { display: flex; align-items: center; gap: 9px; }
  .dad-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue, #5AA9FF);
             box-shadow: 0 0 8px rgba(90,169,255,.8); }
  .dad-txt { font-size: 13.5px; color: var(--body); }
  .dad-txt b { color: #A8D4FF; font-family: var(--mono); font-weight: 500; margin-left: 4px; }
  .dad-actions { display: flex; gap: 8px; margin-top: 11px; flex-wrap: wrap; }
  .dad-btn { flex: 1 1 auto; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
             border-radius: 8px; padding: 8px 12px; border: 1px solid transparent;
             background: #5AA9FF; color: #0A1017; white-space: nowrap; }
  .dad-btn:hover { background: #7FBEFF; }
  .dad-btn.ghost { background: transparent; color: var(--body); border-color: var(--line); flex: 0 0 auto; padding: 8px 16px; }
  .dad-btn.ghost:hover { background: #1B242D; }

  .overlay { position: fixed; inset: 0; z-index: 20; background: rgba(11,15,19,.9);
             display: grid; place-items: center; padding: 20px; }
  .overlay-card { width: 100%; background: var(--panel); border: 1px solid var(--line);
                  border-radius: 13px; padding: 22px; }
  .ov-title { font-size: 19px; font-weight: 600; margin: 5px 0 5px; }
  .ov-note { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 14px; }
  .overlay input { width: 100%; background: #0F151B; color: var(--text); border: 1px solid var(--line);
                   border-radius: 9px; padding: 11px 13px; font: inherit; font-size: 15px; }
  .overlay input:focus { outline: 2px solid #5AA9FF; outline-offset: 1px; border-color: transparent; }
  .ov-err { color: var(--fault); font-size: 12.5px; min-height: 18px; margin-top: 7px; }
  .ov-row { display: flex; gap: 9px; }
  .ov-primary { flex: 1; background: #5AA9FF; color: #0A1017; border: none; border-radius: 9px;
                padding: 11px; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
  .ov-primary:hover { background: #7FBEFF; }
  .ov-ghost { background: transparent; color: var(--body); border: 1px solid var(--line);
              border-radius: 9px; padding: 11px 18px; font: inherit; font-size: 14px; cursor: pointer; }
  .ov-ghost:hover { background: #1B242D; }

  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
</style>
</head>
<body>
  <div class="eyebrow">Gatekeeper</div>
  <h1 id="greeting">What's next</h1>
  <p class="project" id="project"></p>
  <div id="passes"></div>

  <div id="session"></div>

  <div class="dad-banner" id="dad-banner" hidden>
    <div class="dad-row">
      <span class="dad-dot"></span>
      <span class="dad-txt">Dad mode on <b id="dad-clock"></b></span>
    </div>
    <div class="dad-actions">
      <button class="dad-btn" id="dad-games">Play any game</button>
      <button class="dad-btn" id="dad-build">Make a game</button>
      <button class="dad-btn ghost" id="dad-end">End</button>
    </div>
  </div>

  <div id="quest"></div>

  <div class="ask">
    <input type="text" id="wanted" placeholder="What do you want to find out?" autocomplete="off" />
    <button id="go">Ask</button>
  </div>
  <button class="show-btn" id="show">Or show me with the camera</button>
  <button class="show-btn" id="make">Make your own game</button>

  <div class="note" id="note" hidden></div>

  <div id="results"></div>

  <footer>
    <button class="link" id="refresh">New ideas</button>
    <button class="link" id="dad">Dad mode</button>
    <button class="link" id="settings">Parent settings</button>
  </footer>

  <div class="overlay" id="dad-overlay" hidden>
    <div class="overlay-card">
      <div class="eyebrow">Dad mode</div>
      <h2 class="ov-title">Enter your PIN</h2>
      <p class="ov-note" id="dad-ov-note">Opens the browser for everyone and unlocks every game, no quest needed.</p>
      <input type="password" id="dad-pin" inputmode="numeric" autocomplete="off" placeholder="PIN" />
      <div class="ov-err" id="dad-err"></div>
      <div class="ov-row">
        <button class="ov-primary" id="dad-go">Unlock</button>
        <button class="ov-ghost" id="dad-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
