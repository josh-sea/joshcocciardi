<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Show me</title>
<style>
  :root {
    --ink: #0B0F13; --panel: #151C24; --line: #24313D; --trace: #2B3947;
    --live: #35D07F; --open: #F2B441; --fault: #E5484D;
    --text: #E7EEF5; --muted: #7E92A6; --body: #B7C6D4;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--ink); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.5; padding: 18px; min-height: 100vh;
  }
  .eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: .16em;
             text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; margin: 4px 0 14px; }

  .frame {
    position: relative; width: 100%; aspect-ratio: 4/3; border-radius: 12px;
    overflow: hidden; background: #05080B; border: 1px solid var(--line);
    display: grid; place-items: center;
  }
  video, canvas.shot { width: 100%; height: 100%; object-fit: cover; display: block; }
  canvas.shot { display: none; }
  .frame.captured video { display: none; }
  .frame.captured canvas.shot { display: block; }
  .frame .msg { position: absolute; color: var(--muted); font-size: 13px; padding: 20px; text-align: center; }

  .tools { display: flex; gap: 9px; margin-top: 12px; }
  button {
    font: inherit; font-size: 14px; font-weight: 500; border-radius: 10px;
    padding: 11px 18px; cursor: pointer; border: 1px solid transparent;
  }
  .primary { background: var(--open); color: #14181C; }
  .primary:hover { background: #FFC85C; }
  .primary:disabled { background: var(--trace); color: var(--muted); cursor: default; }
  .ghost { background: transparent; color: var(--body); border-color: var(--line); }
  .ghost:hover { background: var(--panel); }
  .shutter { flex: 1; }

  textarea {
    width: 100%; margin-top: 14px; min-height: 72px; resize: vertical;
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 13px; font: inherit; font-size: 14px; line-height: 1.5;
  }
  textarea::placeholder { color: #5D6E7F; }
  textarea:focus { outline: 2px solid var(--open); outline-offset: 1px; border-color: transparent; }

  #results { margin-top: 8px; }
  h2 { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
       color: var(--muted); font-weight: 400; margin: 18px 0 10px; }
  .rail { position: relative; padding-left: 20px; }
  .rail::before { content: ""; position: absolute; left: 4px; top: 8px; bottom: 8px; width: 1.5px; background: var(--trace); }
  .item {
    position: relative; display: block; width: 100%; text-align: left; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; margin-bottom: 8px;
    cursor: pointer; font: inherit; color: var(--text);
  }
  .item::before { content: ""; position: absolute; left: -20.5px; top: 17px; width: 9px; height: 9px;
                  border-radius: 50%; background: var(--trace); border: 2px solid var(--ink); }
  .item:hover { border-color: #35506B; background: #19222C; }
  .item .label { font-size: 14px; font-weight: 500; }
  .item .why { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .item .host { font-family: var(--mono); font-size: 10.5px; color: #5D6E7F; margin-top: 5px; }
  .skeleton { height: 52px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line);
              margin-bottom: 8px; animation: blink 1.1s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: .35 } 50% { opacity: .8 } }
  .note { margin-top: 12px; padding: 11px 13px; border-radius: 9px; background: rgba(242,180,65,.09);
          border: 1px solid rgba(242,180,65,.22); font-size: 13px; color: #F4D79A; line-height: 1.5; }
  .empty { color: var(--muted); font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="eyebrow">Show me</div>
  <h1>Point the camera at what you're working on</h1>

  <div class="frame" id="frame">
    <video id="video" autoplay playsinline muted></video>
    <canvas class="shot" id="shot"></canvas>
    <div class="msg" id="frame-msg" hidden></div>
  </div>

  <div class="tools">
    <button class="primary shutter" id="snap" disabled>Take the picture</button>
    <button class="ghost" id="retake" hidden>Retake</button>
  </div>

  <textarea id="wanted" placeholder="What do you want to do? Like: I want to make the LED light up"></textarea>
  <div class="tools">
    <button class="primary shutter" id="send" disabled>Ask the helper</button>
  </div>

  <div class="note" id="note" hidden></div>
  <div id="results"></div>

  <script src="capture.js"></script>
</body>
</html>
