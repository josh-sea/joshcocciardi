<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket Book: Disney Trivia</title>
<meta name="description" content="A book of Disney trivia tickets. Tap a ticket to reveal the answer, keep score, and tear through a round.">
<meta name="theme-color" content="#251C3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%9F%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Karla:ital,wght@0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --ink: #2B2140;
    --ink-soft: #5B4E75;
    --night: #251C3E;
    --night-deep: #1A1330;
    --gold: #E8B33C;
    --stock: #F2D88F;
    --stock-edge: #d9bd6d;
    --display: "Alfa Slab One", "Rockwell", Georgia, serif;
    --body: "Karla", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }

  body {
    margin: 0;
    padding: 18px 14px 32px;
    font-family: var(--body);
    color: #EDE7F7;
    background:
      radial-gradient(1200px 600px at 50% -10%, #3A2C60 0%, rgba(58,44,96,0) 60%),
      linear-gradient(180deg, var(--night) 0%, var(--night-deep) 100%);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 560px; margin: 0 auto; }

  /* ---- masthead ---- */
  header { margin-bottom: 16px; }
  .masthead {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .sound {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 40px; height: 40px;
    margin-top: 2px;
    padding: 0;
    color: #CFC3E8;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 50%;
    cursor: pointer;
  }
  .sound svg { width: 19px; height: 19px; display: block; }
  .sound .off { display: none; }
  .sound[aria-pressed="false"] { color: #8E80AE; }
  .sound[aria-pressed="false"] .on { display: none; }
  .sound[aria-pressed="false"] .off { display: block; }
  .mark {
    font-family: var(--display);
    font-size: clamp(28px, 8.5vw, 40px);
    line-height: 0.95;
    letter-spacing: -0.01em;
    color: var(--gold);
    margin: 0;
  }
  .mark span { display: block; color: #EDE7F7; }
  .sub {
    margin: 8px 0 0;
    font-size: 14px;
    color: #B6A9D4;
    max-width: 42ch;
  }

  /* ---- category chips ---- */
  .cats {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding: 14px 0 7px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .cats::-webkit-scrollbar { display: none; }
  .subcats { padding: 0 0 12px; }
  /* `display: flex` above would otherwise beat the hidden attribute outright. */
  .cats[hidden] { display: none; }
  /* Divides "what kind of thing" from "where in the resort". */
  .sep {
    flex: 0 0 auto;
    width: 1px;
    align-self: stretch;
    margin: 3px 5px;
    background: rgba(255,255,255,0.18);
  }
  .chip {
    flex: 0 0 auto;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: #CFC3E8;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    padding: 7px 13px;
    cursor: pointer;
  }
  .chip .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: 1px;
  }
  .chip[aria-pressed="true"] {
    color: var(--ink);
    background: #EDE7F7;
    border-color: #EDE7F7;
  }
  .chip:focus-visible, .btn:focus-visible, .ticket:focus-visible,
  .verdict button:focus-visible, .sound:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 3px;
  }

  /* ---- the ticket ---- */
  .book { position: relative; }
  .book::before, .book::after {
    content: "";
    position: absolute;
    inset: 10px 0 -10px;
    border-radius: 14px;
    background: rgba(255,255,255,0.10);
    z-index: 0;
  }
  .book::after { inset: 18px 6px -18px; background: rgba(255,255,255,0.05); }

  .stage { perspective: 1400px; position: relative; z-index: 1; }

  .ticket {
    display: grid;
    width: 100%;
    text-align: left;
    font: inherit;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 620ms cubic-bezier(.2,.75,.25,1);
  }
  .ticket.flipped { transform: rotateY(180deg); }

  .face {
    grid-area: 1 / 1;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--stock);
    color: var(--ink);
    border-radius: 14px;
    padding: 16px 18px 20px;
    min-height: 310px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 18px 40px rgba(0,0,0,.45);
    position: relative;
    overflow: hidden;
    transition: background 500ms ease;
  }
  .face.back { transform: rotateY(180deg); }

  /* perforated notches down the sides */
  .face::before, .face::after {
    content: "";
    position: absolute;
    top: 62px; bottom: 0;
    width: 12px;
    background-image: radial-gradient(circle at 0 6px, var(--night-deep) 5px, transparent 5.5px);
    background-size: 12px 20px;
  }
  .face::before { left: -6px; }
  .face::after { right: -6px; transform: scaleX(-1); }

  .stub {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 12px;
    border-bottom: 2px dashed rgba(43,33,64,.32);
  }
  .serial {
    font-family: var(--display);
    font-size: 26px;
    line-height: 1;
    color: var(--ink);
  }
  .serial small { font-size: 12px; opacity: .6; margin-right: 3px; }
  .catname {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .04em;
    text-align: right;
    color: var(--ink-soft);
    max-width: 16ch;
    line-height: 1.25;
  }
  .catname i {
    display: block;
    font-style: normal;
    font-weight: 600;
    opacity: .68;
  }

  .prompt {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 18px 0 10px;
  }
  .prompt p {
    margin: 0;
    font-size: clamp(19px, 5.2vw, 23px);
    line-height: 1.32;
    font-weight: 600;
    letter-spacing: -0.011em;
  }
  .back .prompt p {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(21px, 5.6vw, 26px);
    line-height: 1.24;
  }
  .asked {
    margin: 0 0 10px;
    font-size: 14px;
    font-style: italic;
    color: var(--ink-soft);
    line-height: 1.35;
  }

  .hint {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .hint::before {
    content: "";
    width: 16px; height: 16px;
    border: 2px solid currentColor;
    border-radius: 50%;
    opacity: .5;
  }

  /* shimmer sweep on reveal */
  .sheen {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.85) 50%, transparent 62%);
    transform: translateX(-110%);
    opacity: 0;
  }
  .ticket.flipped .back .sheen { animation: sweep 900ms 180ms ease-out; }
  @keyframes sweep {
    0% { transform: translateX(-110%); opacity: 0; }
    22% { opacity: 1; }
    100% { transform: translateX(110%); opacity: 0; }
  }

  .verdict {
    display: flex;
    gap: 8px;
    padding-top: 14px;
    margin-top: auto;
    border-top: 2px dashed rgba(43,33,64,.32);
  }
  .verdict button {
    flex: 1;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    background: rgba(43,33,64,.07);
    border: 1.5px solid rgba(43,33,64,.3);
    border-radius: 9px;
    padding: 9px 6px;
    cursor: pointer;
  }
  .verdict button:active { background: rgba(43,33,64,.16); }
  .verdict button[data-marked="true"] { background: var(--ink); color: var(--stock); border-color: var(--ink); }

  /* ---- footer controls ---- */
  .meter { margin-top: 30px; }
  .rule {
    height: 3px;
    background: rgba(255,255,255,.12);
    border-radius: 2px;
    overflow: hidden;
  }
  .rule i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--gold);
    transition: width 400ms ease;
  }
  .tally {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 9px;
    font-size: 13px;
    color: #B6A9D4;
  }
  .tally b { color: #EDE7F7; font-weight: 700; }

  .btn {
    display: block;
    width: 100%;
    margin-top: 16px;
    font: inherit;
    font-size: 16px;
    font-weight: 800;
    color: var(--night-deep);
    background: var(--gold);
    border: 0;
    border-radius: 11px;
    padding: 15px;
    cursor: pointer;
  }
  .btn:active { transform: translateY(1px); }
  .btn.ghost {
    background: transparent;
    color: #CFC3E8;
    border: 1.5px solid rgba(255,255,255,.2);
    font-size: 14px;
    padding: 11px;
  }

  /* ---- end of book ---- */
  .done { text-align: center; padding: 30px 6px; }
  .done .serial { font-size: 44px; display: block; margin-bottom: 6px; }
  .done p { margin: 0 auto; max-width: 30ch; font-size: 17px; line-height: 1.4; color: var(--ink-soft); }

  .backlink {
    display: block;
    margin: 22px auto 0;
    text-align: center;
    font-size: 13px;
    color: #B6A9D4;
    text-decoration: none;
  }
  .backlink:hover { color: #EDE7F7; }

  @media (prefers-reduced-motion: reduce) {
    .ticket { transition: opacity 200ms ease; }
    .ticket.flipped { transform: none; }
    .face.back { transform: none; }
    .sheen { display: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="masthead">
      <h1 class="mark">Ticket book<span>Disney trivia</span></h1>
      <button class="sound" id="sound" aria-pressed="true" aria-label="Turn sound off">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></svg>
      </button>
    </div>
    <p class="sub">Tap a ticket to reveal the answer. Every question comes up once, then the book is spent.</p>
  </header>

  <div class="cats" id="cats" role="group" aria-label="Choose a shelf"></div>
  <div class="cats subcats" id="subcats" role="group" aria-label="Narrow the round" hidden></div>

  <div class="book">
    <div class="stage">
      <div class="ticket" id="ticket" role="button" tabindex="0" aria-live="polite"></div>
    </div>
  </div>

  <div class="meter">
    <div class="rule"><i id="bar"></i></div>
    <div class="tally">
      <span id="count"></span>
      <span id="score"></span>
    </div>
    <button class="btn" id="next">Next ticket</button>
    <button class="btn ghost" id="reset">Start a fresh book</button>
  </div>

  <a class="backlink" href="/projects">← Back to all projects</a>
</div>

/* One flat pile the game actually deals from. Film rows and park rows arrive
 * in different shapes; everything downstream sees the same object. */
const ALL = [
  ...Q.map(r => ({ g: "film", cat: r[0], park: null, q: r[1], a: r[2] })),
  ...PQ.map(r => ({ g: "park", cat: r[0], park: r[1], q: r[2], a: r[3] }))
];

/* ---- sound ----------------------------------------------------------------
 * Every effect is synthesised from oscillators and filtered noise, so there
 * are no audio files to ship, cache or license. Solra next door does the same
 * thing for its tones. The context is not built until the first gesture,
 * because browsers refuse to start one before that anyway.
 */
const SOUND_KEY = "disneyTrivia.sound";
let audio = null;
let master = null;
let gestured = false;
let sound = true;
try { sound = localStorage.getItem(SOUND_KEY) !== "off"; } catch (e) { /* private mode */ }

function ac() {
  if (!audio) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audio = new AC();
    master = audio.createGain();
    master.gain.value = 0.5;
    master.connect(audio.destination);
  }
  if (audio.state === "suspended") audio.resume();
  return audio;
}

// One bell partial: blooms in a few milliseconds, then rings out.
function tone(freq, at, dur, level, type) {
  const c = ac(); if (!c) return;
  const t = c.currentTime + at;
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(level, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t);
  o.stop(t + dur + 0.02);
}

// A burst of noise swept through a bandpass: paper, air, anything textured.
function noise(at, dur, level, from, to, q) {
  const c = ac(); if (!c) return;
  const t = c.currentTime + at;
  const n = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, n, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = c.createBufferSource();
  src.buffer = buf;
  const f = c.createBiquadFilter();
  f.type = "bandpass";
  f.Q.value = q;
  f.frequency.setValueAtTime(from, t);
  f.frequency.exponentialRampToValueAtTime(to, t + dur);
  const g = c.createGain();
  g.gain.value = level;
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t);
}

const SFX = {
  // Wand flick: high blips scattered up a C major arpeggio over a breath of
  // air, detuned a little each time so repeats never sound identical. Timed to
  // land with the sheen sweeping across the answer.
  reveal() {
    [2093, 2637, 3136, 3520, 4186].forEach((f, i) =>
      tone(f * (0.98 + Math.random() * 0.04), 0.10 + 0.035 * i, 0.5 - 0.05 * i, 0.10));
    noise(0.08, 0.45, 0.06, 900, 7000, 0.7);
  },
  // Got it: a bright major triad with a shimmer on top.
  right() {
    [1046.5, 1318.5, 1568].forEach((f, i) => tone(f, 0.055 * i, 0.55, 0.15));
    tone(2093, 0.17, 0.6, 0.055);
  },
  // Missed it: two soft notes stepping down. A trivia book for kids does not
  // need a buzzer.
  wrong() {
    tone(392, 0, 0.3, 0.12, "triangle");
    tone(311.1, 0.105, 0.45, 0.10, "triangle");
  },
  // The perforation giving way as the ticket comes out of the book.
  tear() { noise(0, 0.2, 0.24, 2600, 500, 1.1); },
  // Book spent: a four-note climb with a sparkle tail.
  spent() {
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.09 * i, 0.85, 0.14));
    [1568, 2093, 2637].forEach((f, i) => tone(f, 0.42 + 0.07 * i, 0.7, 0.07));
  },
  // Riffling to a fresh round.
  riffle() {
    for (let i = 0; i < 4; i++) noise(0.045 * i, 0.07, 0.17, 3200, 1400, 1.6);
  }
};

function play(name) {
  if (!sound || !gestured) return;
  // Audio is a garnish: a device that will not give us a context still gets
  // to play the game.
  try { SFX[name](); } catch (e) { /* no audio here */ }
}

// Build and resume the context inside the very first gesture, so the first
// effect is not swallowed by the autoplay policy.
const wake = () => { gestured = true; ac(); };
document.addEventListener("pointerdown", wake, { once: true });
document.addEventListener("keydown", wake, { once: true });

const soundBtn = document.getElementById("sound");
function drawSound() {
  soundBtn.setAttribute("aria-pressed", String(sound));
  soundBtn.setAttribute("aria-label", sound ? "Turn sound off" : "Turn sound on");
}
soundBtn.onclick = () => {
  sound = !sound;
  try { localStorage.setItem(SOUND_KEY, sound ? "on" : "off"); } catch (e) { /* private mode */ }
  drawSound();
  play("right"); // a confirmation you can hear, when you have just turned it on
};
drawSound();

// ---- state ----
// `group` is the shelf (all / film / park), `filter` the round being dealt.
// They move independently: picking a shelf opens its sub-chips without
// committing you to one of them.
let group = "all";
let filter = "all";
let pool = [];
let current = null;
let seen = 0;
let right = 0, wrong = 0;
let marked = null;
let spent = false;

const ticket = document.getElementById("ticket");
const nextBtn = document.getElementById("next");

/* Filters read as "all", a shelf ("film" / "park"), "cat:<key>" for a
 * category or type, or "park:<key>" for somewhere in the resort. Slicing the
 * park pile by type and by park is the whole point of the two-tag rows. */
function pick(f) {
  if (f === "all") return ALL.slice();
  if (GROUPS[f]) return ALL.filter(x => x.g === f);
  const cut = f.indexOf(":");
  const kind = f.slice(0, cut), key = f.slice(cut + 1);
  if (kind === "cat") return ALL.filter(x => x.cat === key);
  if (kind === "park") return ALL.filter(x => x.park === key);
  return ALL.slice();
}

// A park ticket is printed on its park's stock and labelled with both tags,
// so you always know where you are as well as what you are being asked.
function stockOf(x) { return x.g === "park" ? PARKS[x.park].stock : CATS[x.cat].stock; }
function labelOf(x) {
  return x.g === "park"
    ? PARKS[x.park].name + "<i>" + CATS[x.cat].name + "</i>"
    : CATS[x.cat].name;
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startBook(cat) {
  filter = cat;
  pool = shuffle(pick(cat));
  seen = 0; right = 0; wrong = 0;
  spent = false;
  play("riffle");
  drawChips();
  nextTicket(true);
}

function chip(box, name, stock, on, fn) {
  const b = document.createElement("button");
  b.className = "chip";
  b.setAttribute("aria-pressed", String(on));
  b.innerHTML = '<span class="dot" style="background:' + stock + '"></span>' + name;
  b.onclick = fn;
  box.appendChild(b);
}

function drawChips() {
  const shelf = document.getElementById("cats");
  shelf.innerHTML = "";
  chip(shelf, "Everything", "#EDE7F7", group === "all", () => openShelf("all"));
  Object.entries(GROUPS).forEach(([k, g]) =>
    chip(shelf, g.name, k === "film" ? "#F2D88F" : "#B7DFA8", group === k, () => openShelf(k)));

  // The second row only exists once a shelf is open, and the park shelf gets
  // a divider between "what kind of thing" and "where in the resort".
  const sub = document.getElementById("subcats");
  sub.innerHTML = "";
  sub.hidden = group === "all";
  if (sub.hidden) return;

  const g = GROUPS[group];
  chip(sub, g.all, "#EDE7F7", filter === group, () => startBook(group));
  g.subs.forEach(k =>
    chip(sub, CATS[k].name, CATS[k].stock, filter === "cat:" + k, () => startBook("cat:" + k)));
  if (g.parks) {
    sub.appendChild(Object.assign(document.createElement("span"), { className: "sep" }));
    g.parks.forEach(k =>
      chip(sub, PARKS[k].name, PARKS[k].stock, filter === "park:" + k, () => startBook("park:" + k)));
  }
}

function openShelf(g) { group = g; startBook(g === "all" ? "all" : g); }

function nextTicket(dealt) {
  ticket.classList.remove("flipped");
  marked = null;
  if (!dealt) play("tear");
  const draw = () => {
    if (pool.length === 0) { renderDone(); return; }
    current = pool.pop();
    seen++;
    render();
    updateMeter();
  };
  // let the card turn back over before swapping the content
  if (ticket.dataset.revealed === "1") { ticket.dataset.revealed = "0"; setTimeout(draw, 260); }
  else draw();
}

function render() {
  ticket.innerHTML =
    face("front", current,
      '<div class="prompt"><p>' + esc(current.q) + '</p></div>' +
      '<div class="hint">Tap to reveal</div>') +
    face("back", current,
      '<div class="sheen"></div>' +
      '<div class="prompt"><div><p class="asked">' + esc(current.q) + '</p><p>' + esc(current.a) + '</p></div></div>' +
      '<div class="verdict">' +
        '<button data-v="right">Got it</button>' +
        '<button data-v="wrong">Missed it</button>' +
      '</div>');
  ticket.querySelectorAll(".verdict button").forEach(b => {
    b.onclick = e => { e.stopPropagation(); mark(b.dataset.v); };
  });
  nextBtn.textContent = "Next ticket";
}

function face(side, item, inner) {
  return '<div class="face ' + side + '" style="--stock:' + stockOf(item) + '">' +
    '<div class="stub"><span class="serial"><small>No.</small>' + pad(seen) + '</span>' +
    '<span class="catname">' + labelOf(item) + '</span></div>' + inner + '</div>';
}

function mark(v) {
  if (marked === v) return;
  if (marked === "right") right--;
  if (marked === "wrong") wrong--;
  marked = v;
  v === "right" ? right++ : wrong++;
  play(v);
  ticket.querySelectorAll(".verdict button").forEach(b => {
    b.dataset.marked = (b.dataset.v === v);
  });
  updateMeter();
}

function renderDone() {
  const total = pick(filter).length;
  spent = true;
  play("spent");
  ticket.classList.remove("flipped");
  ticket.dataset.revealed = "0";
  ticket.innerHTML = '<div class="face front" style="--stock:#EDE7F7">' +
    '<div class="done" style="margin:auto">' +
    '<span class="serial">' + total + '/' + total + '</span>' +
    '<p>Book spent. Every ticket in this round has been torn.' +
    (right + wrong ? ' You called ' + right + ' right and ' + wrong + ' wrong.' : '') +
    '</p></div></div>';
  nextBtn.textContent = "Start this round again";
  updateMeter();
}

function updateMeter() {
  const total = pick(filter).length || 1;
  const used = Math.min(seen, total);
  document.getElementById("bar").style.width = (used / total * 100) + "%";
  document.getElementById("count").textContent = used + " of " + total + " tickets";
  document.getElementById("score").textContent = (right + wrong) ? right + " right · " + wrong + " missed" : "";
}

function pad(n) { return String(n).padStart(3, "0"); }
function esc(s) { return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

function flip() {
  if (!ticket.querySelector(".back")) return;
  ticket.classList.toggle("flipped");
  const revealed = ticket.classList.contains("flipped");
  ticket.dataset.revealed = revealed ? "1" : "0";
  if (revealed) play("reveal");
}

ticket.addEventListener("click", flip);
ticket.addEventListener("keydown", e => {
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
});
nextBtn.onclick = () => { if (spent) startBook(filter); else nextTicket(); };
document.getElementById("reset").onclick = () => startBook(filter);

startBook("all");
</script>
</body>
</html>
