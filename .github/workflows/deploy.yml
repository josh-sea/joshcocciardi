# Deploys the site to Firebase whenever a PR merges to master
# (or on manual trigger from the Actions tab).
#
# One-time setup — add the deploy credential as a repo secret:
#   1. Firebase console → ⚙️ Project settings → Service accounts
#      → "Generate new private key" (downloads a JSON file)
#   2. GitHub repo → Settings → Secrets and variables → Actions
#      → New repository secret, name: FIREBASE_SERVICE_ACCOUNT,
#      value: the entire contents of that JSON file
#
# What it deploys (mirrors ./deploy.sh):
#   - copies the static apps (playball, canitwo, recipebox, psx, solra, disney-trivia,
#     tophat-spears, party-room) into portfolio/public
#   - builds the mail app and copies it to portfolio/public/projects/electronic-mail
#   - builds the portfolio (the built copy of moments is committed under
#     apps/portfolio/public/projects/)
#   - firebase deploy --only hosting,firestore:rules,database,storage,functions
#
# Hosting is multi-site (targets in firebase.json / .firebaserc):
#   - portfolio   → joshcocciardi.com (apps/portfolio/build, includes
#                   the /projects/* mirrors of the static apps)
#   - gramandpops → gramandpops.com (apps/recipebox served at the root)
#   - igatekeeper → igatekeeper.web.app
#   - ezpayze     → ezpayze.web.app (apps/ezpayze/web/dist), deployed in its
#                   own step with its own functions codebase, so a problem
#                   there can never block the other sites
#   - roy        → josh-cocciardi-roy.web.app (apps/roy/dist, the Expo web
#                   export), deployed in its own step with its own functions
#                   codebase, same as EzPayze. Its Realtime Database rules
#                   (/roy in database.rules.json) go out with the shared rules.
#
# Indexes are deliberately NOT deployed from CI: the project has indexes
# that aren't captured in firestore.indexes.json, and a non-interactive
# index deploy would require --force, which deletes them. Manage indexes
# from the Firebase console (or sync the file with
# `firebase firestore:indexes > firestore.indexes.json` and re-enable).

name: Deploy to Firebase

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/portfolio/package-lock.json

      # Solra ships its own dependency-free round-trip suite: it renders every
      # word in the lexicon and decodes the samples back. No install needed.
      - name: Test Solra
        working-directory: apps/solra
        run: node test/roundtrip.mjs

      # The peephole must never open past its ceiling, and a pin must be
      # judged the same way on a square map and a panoramic one. Pure maths,
      # no emulator. The security rules have their own suite that needs the
      # Firestore emulator — see functions/test/README.md.
      - name: Test Where Am I
        run: node apps/portfolio/test/whereami.test.mjs

      # The planner routes a family round a park on a day that cannot be
      # repeated: a suggestion that makes you late for a Lightning Lane, or
      # a wait read off the wrong hour of the forecast, costs real time.
      # Pure maths on fixtures, no network.
      - name: Test Park Planner
        run: node apps/portfolio/test/park.test.mjs

      # The per-ride day curve, and the claim that a ride is posting well
      # under what it usually does. Getting that wrong sends a family across
      # a park for nothing.
      - name: Test the wait curves
        run: node apps/portfolio/test/curve.test.mjs

      # What else is on in a given hour. The claims are specific enough to
      # be wrong: a parade at two, a park shutting at six for a party.
      - name: Test what's on
        run: node apps/portfolio/test/whatson.test.mjs

      # The wait-time archive. Written once per park-day and then kept for
      # years, so a shaping mistake is not a bug you notice: it is a year of
      # data that means something other than you think. The date arithmetic
      # is re-run in four timezones, because CI is UTC and the mistake this
      # guards against is invisible there.
      - name: Test the wait archive
        run: node apps/portfolio/test/parkdaily.test.mjs

      # The history screen. Two implementations meet here: the function
      # encodes a year of waits into a string and the browser decodes it and
      # indexes into it by date. Disagree about where day N sits and every
      # chart is silently shifted while still looking plausible, so the suite
      # checks them against each other rather than each against a fixture.
      # The screen itself is driven in a real browser by
      # apps/portfolio/test/history-render.mjs, which needs Chromium and the
      # live archive and so is not run here.
      - name: Test the history screen
        run: node apps/portfolio/test/hist.test.mjs

      # The topic builder composes the line you read out loud, which is
      # exactly the sort of thing that rots into "Desserts in in any park"
      # unless something checks every subject against every place.
      - name: Test 1 to 10
        run: node apps/portfolio/test/scale.test.mjs

      # Rooms, roles and turn order. The whole game is "only one person
      # knows the number", so who may act when is worth proving. The
      # security rules behind it have their own emulator suite, which CI
      # does not run — see functions/test/scale-rules.test.mjs.
      - name: Test 1 to 10 rooms
        run: node apps/portfolio/test/room.test.mjs

      # Party Room: all four games played start to finish in node, through a
      # fake database round trip at every step, plus the host hand-over. The
      # rules behind it have an emulator suite CI does not run; see
      # functions/test/party-rules.test.mjs.
      - name: Test Party Room
        run: node apps/portfolio/test/party-room.test.mjs

      # Swing Coach's geometry engine is inlined in its static page; the suite
      # lifts it out of the shipped HTML and runs synthetic swings through it.
      # No install needed.
      - name: Test Swing Coach
        working-directory: apps/portfolio
        run: node test/swing-coach.test.mjs

      # The caddy's distance model, geometry and recommendation engine are
      # plain modules with no DOM, so they run the same way.
      - name: Test Golf Caddy
        working-directory: apps/portfolio
        run: node test/caddy.test.mjs

      # Meal Planner week math and inventory splitting. Pure functions, no
      # install needed.
      - name: Test Meal Planner helpers
        working-directory: apps/portfolio
        run: node test/meal-planner.test.mjs

      # My Reading Buddy's recording-format choice, spread sizing, and page
      # order helpers. Pure functions, no install needed.
      - name: Test My Reading Buddy helpers
        working-directory: apps/portfolio
        run: node test/readingbuddy.test.mjs

      # Seasonal Box HQ's date math, inbox order, seed agents, and the check
      # that the client's stage machine and action registry match the copy the
      # Cloud Functions enforce. Pure functions, no install needed.
      - name: Test Seasonal Box helpers
        working-directory: apps/portfolio
        run: node test/seasonal-box.test.mjs

      # Tophat & Spears: the match simulation and lobby seat rules are pure
      # modules shared by every player's browser. No install needed.
      - name: Test Tophat & Spears
        run: node apps/portfolio/test/tophat-spears.test.mjs

      # Camboy and its Sweat Boy cartridge: puddle layout, venues, power-ups,
      # the returning players' slip check and the joystick math are plain
      # modules. No install needed.
      - name: Test Camboy and Sweat Boy
        working-directory: apps/portfolio
        run: node test/sweat-boy.test.mjs

      # Boulder Smash on the Camboy: button combos, who gets hurt by what,
      # and the city layouts. Plain modules, no install needed.
      - name: Test Boulder Smash cartridge
        working-directory: apps/portfolio
        run: node test/boulder.test.mjs

      # Camboku: every generated board must have exactly one answer and be
      # finishable by logic alone, and hints must never point the wrong way.
      # Plain module, no install needed.
      - name: Test Camboku
        working-directory: apps/portfolio
        run: node test/camboku.test.mjs

      - name: Copy static apps into portfolio
        run: |
          for app in playball canitwo recipebox psx solra disney-trivia tophat-spears party-room; do
            mkdir -p "apps/portfolio/public/projects/$app"
            rm -rf "apps/portfolio/public/projects/$app"
            cp -r "apps/$app" "apps/portfolio/public/projects/$app"
            rm -rf "apps/portfolio/public/projects/$app/test" "apps/portfolio/public/projects/$app/scripts"
            rm -f "apps/portfolio/public/projects/$app/README.md" \
                  "apps/portfolio/public/projects/$app/package.json" \
                  "apps/portfolio/public/projects/$app/prototype.html"
          done

      # The mail app is a CRA build, not a static copy. Its config comes from
      # apps/email/.env.production (public client identifiers only).
      - name: Test and build mail app
        working-directory: apps/email
        run: |
          npm ci
          CI=true npm test -- --watchAll=false
          npm run build

      - name: Copy mail app into portfolio
        run: |
          target="apps/portfolio/public/projects/electronic-mail"
          rm -rf "$target"
          mkdir -p "$target"
          cp -r apps/email/build/. "$target/"

      - name: Build portfolio
        working-directory: apps/portfolio
        env:
          CI: "false" # CRA fails on lint warnings when CI=true
        run: |
          npm ci
          npm run build

      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm ci

      # EzPayze: unit tests (schedule, plans, wording, tokens, billing), then
      # build its functions codebase and web app. Rules and end-to-end suites
      # need the emulators; see apps/ezpayze/README.md.
      - name: Test and build EzPayze functions
        working-directory: apps/ezpayze/functions
        run: |
          npm ci
          npm test

      - name: Build EzPayze web app
        working-directory: apps/ezpayze/web
        run: |
          npm ci
          npm run build

      # Roy: the Expo app exported as a static web build, plus its functions
      # codebase. The rules suite needs the database emulator; see
      # apps/roy/README.md.
      - name: Build Roy web app
        working-directory: apps/roy
        run: |
          npm ci
          npx expo export -p web --clear

      - name: Install Roy functions dependencies
        working-directory: apps/roy/functions
        run: npm ci

      - name: Deploy hosting + Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set — see the comment at the top of .github/workflows/deploy.yml"
            exit 1
          fi
          printf '%s' "$FIREBASE_SA" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools@13 deploy --only hosting:portfolio,hosting:gramandpops,hosting:igatekeeper,firestore:rules,database,storage,functions:default --project josh-cocciardi --non-interactive --force

      # EzPayze ships separately (its rules went out above with the shared
      # rules files). Creates the Hosting site the first time.
      - name: Deploy EzPayze
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          npx firebase-tools@13 hosting:sites:get ezpayze --project josh-cocciardi --non-interactive >/dev/null 2>&1 \
            || npx firebase-tools@13 hosting:sites:create ezpayze --project josh-cocciardi --non-interactive
          npx firebase-tools@13 deploy --only hosting:ezpayze,functions:ezpayze --project josh-cocciardi --non-interactive --force

      # Roy ships separately too (its database rules went out above).
      # Creates the Hosting site the first time.
      - name: Deploy Roy
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          npx firebase-tools@13 hosting:sites:get josh-cocciardi-roy --project josh-cocciardi --non-interactive >/dev/null 2>&1 \
            || npx firebase-tools@13 hosting:sites:create josh-cocciardi-roy --project josh-cocciardi --non-interactive
          npx firebase-tools@13 deploy --only hosting:roy,functions:roy --project josh-cocciardi --non-interactive --force
